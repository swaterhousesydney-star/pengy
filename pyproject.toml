[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengy-cli"
version = "0.3.0"
description = "Keeps your AI coding agents working after they hit the rate limit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["claude-code", "codex", "gemini-cli", "rate-limit", "ai-agents", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/swaterhousesydney-star/pengy"
Source = "https://github.com/swaterhousesydney-star/pengy"
Issues = "https://github.com/swaterhousesydney-star/pengy/issues"

[project.scripts]
pengy = "pengy:main"

[tool.setuptools]
py-modules = ["pengy"]
